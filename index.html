<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect — Safi ➔ Marrakech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-black': '#000000',
                        'brand-canvas': '#ffffff',
                        'brand-soft': '#efefef',
                        'brand-softer': '#f3f3f3',
                        'brand-body': '#5e5e5e',
                        'brand-border': '#e2e2e2'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-brand-canvas text-brand-black antialiased font-sans min-h-screen">
    <header
        class="sticky top-0 z-50 bg-white border-b border-brand-border px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <span class="text-xl font-bold tracking-tight">BusDirect</span>
            <span class="bg-brand-soft px-4 py-1.5 rounded-full text-sm font-medium">Safi ➔ Marrakech</span>
        </div>

        <div class="flex items-center gap-3">
            <div id="stat-seats" class="bg-brand-soft px-4 py-1.5 rounded-full text-sm font-medium">
                Places libres: <span id="count-free" class="font-bold">20</span> / 20
            </div>
            <div id="stat-revenue" class="bg-brand-black text-white px-4 py-1.5 rounded-full text-sm font-medium">
                Recette: <span id="count-revenue" class="font-bold">0</span> DH
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
    </main>
</body>

</html>
